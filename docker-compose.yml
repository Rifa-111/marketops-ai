services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://marketops:marketops@db:5432/marketops
      API_KEY: local-demo-key
    depends_on:
      db: {condition: service_healthy}
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marketops
      POSTGRES_PASSWORD: marketops
      POSTGRES_DB: marketops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketops"]
      interval: 5s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
