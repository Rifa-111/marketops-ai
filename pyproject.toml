[project]
name = "marketops-ai"
version = "0.1.0"
description = "Synthetic post-trade reconciliation and AI-assisted exception management platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "httpx>=0.27,<1", "prometheus-client>=0.20,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]
ml = ["mlflow>=2.17,<4"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
ignore = ["E501", "E402"]
